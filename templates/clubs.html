{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen pt-16 bg-gray-50 dark:bg-gray-900" x-data="{
    searchQuery: '{{ search_query|escapejs }}',
    selectedType: '{{ selected_type|escapejs }}',
    selectedDepartment: '{{ selected_department|escapejs }}',
    clubs: JSON.parse('{{ clubs_json|escapejs }}'),
    departments: JSON.parse('{{ departments|escapejs }}'),
    selectedSort: '{{ sort_by|escapejs }}',
    showFilters: false,
    
    filteredClubs() {
        return this.clubs.filter(club => {
            console.log(club); // Debug each club
            const matchesSearch = club.name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                club.description.toLowerCase().includes(this.searchQuery.toLowerCase());
            const matchesType = this.selectedType === 'all' || club.type === this.selectedType;
            const matchesDepartment = this.selectedDepartment === 'all' || 
                                    (club.type === 'dept' && club.department_id === parseInt(this.selectedDepartment));
            return matchesSearch && matchesType && (club.type !== 'dept' || matchesDepartment);
        }).sort((a, b) => {
            if (this.selectedSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
            if (this.selectedSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
            if (this.selectedSort === 'members') return b.member_count - a.member_count;
            if (this.selectedSort === 'name') return a.name.localeCompare(b.name);
            return 0;
        });
    }
}">
    <!-- Hero Section -->
    <div class="relative bg-gradient-to-r from-indigo-600 to-purple-600">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white sm:text-4xl">
                    Discover Clubs
                </h1>
                <p class="mt-3 max-w-2xl mx-auto text-indigo-100 sm:text-lg">
                    Join department-specific or global clubs to connect with like-minded peers
                </p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search and Filters -->
        <div class="mb-8 space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="h-5 w-5 text-gray-400"></i>
                </div>
                <input
                    type="text"
                    x-model="searchQuery"
                    class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg leading-5 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="Search clubs by name or description..."
                >
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-4">
                <!-- Club Type Filter -->
                <div class="relative">
                    <select
                        x-model="selectedType"
                        class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
                    >
                        <option value="all">All Types</option>
                        <option value="global">Global Clubs</option>
                        <option value="dept">Department Clubs</option>
                    </select>
                </div>

                <!-- Department Filter -->
                <div class="relative" x-show="selectedType === 'all' || selectedType === 'dept'">
                    <select
                        x-model="selectedDepartment"
                        class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
                    >
                        <template x-for="dept in JSON.parse('{{ departments|escapejs }}')" :key="dept.id">
                            <option :value="dept.id" x-text="dept.name"></option>
                        </template>
                    </select>
                </div>

                <!-- Sort Filter -->
                <div class="relative">
                    <select
                        x-model="selectedSort"
                        class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
                    >
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="members">Most Members</option>
                        <option value="name">Alphabetical</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Club Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="club in filteredClubs()" :key="club.id">
                <div class="group bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-all duration-300">
                    <!-- Club Image -->
                    <div class="relative h-48 w-full overflow-hidden">
                        <img :src="club.image_url" :alt="club.name" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black bg-opacity-40 group-hover:bg-opacity-30 transition-all duration-300"></div>
                        <!-- Club Type Badge -->
                        <div class="absolute top-4 right-4">
                            <span class="px-3 py-1 text-sm font-medium rounded-full" :class="{
                                'bg-purple-500 text-white': club.type === 'global',
                                'bg-blue-500 text-white': club.type === 'dept'
                            }" x-text="club.type === 'global' ? 'Global Club' : 'Department Club'"></span>
                        </div>
                    </div>

                    <!-- Club Details -->
                    <div class="p-6">
                        <div class="h-[120px]">
                            <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-2" x-text="club.name"></h3>
                            <p class="text-gray-600 dark:text-gray-300 line-clamp-2" x-text="club.description"></p>
                        </div>

                        <!-- Department Tag (for dept clubs) -->
                        <div x-show="club.type === 'dept'" class="mt-4 flex items-center">
                            <i data-lucide="building-2" class="h-4 w-4 text-gray-500 dark:text-gray-400 mr-2"></i>
                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="club.department_name"></span>
                        </div>

                        <!-- Club Stats -->
                        <div class="mt-4 flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="flex items-center">
                                    <i data-lucide="users" class="h-4 w-4 text-gray-500 dark:text-gray-400 mr-1"></i>
                                    <span class="text-sm text-gray-500 dark:text-gray-400" x-text="`${club.member_count} members`"></span>
                                </div>
                                <div class="flex items-center">
                                    <i data-lucide="calendar" class="h-4 w-4 text-gray-500 dark:text-gray-400 mr-1"></i>
                                    <span class="text-sm text-gray-500 dark:text-gray-400" x-text="`${club.events_count} events`"></span>
                                </div>
                            </div>
                            <template x-if="club.is_member || !club.is_member">
                                <a :href="'/clubs/' + club.id" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all duration-200">
                                    View Club
                                </a>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="filteredClubs().length === 0" class="text-center py-12">
            <i data-lucide="search-x" class="mx-auto h-12 w-12 text-gray-400 dark:text-gray-600"></i>
            <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">No clubs found</h3>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Try adjusting your search or filter criteria
            </p>
        </div>
    </div>
</div>

<script>
    function joinClub(clubId) {
        // Implement the logic to join a club here
        // You may want to make an AJAX request to your backend
        console.log(`Joining club with ID: ${clubId}`);
        // After successful join, you may want to update the club's is_member status
        // and refresh the component
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });
</script>
{% endblock %}
