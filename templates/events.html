{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen pt-16 bg-gray-50 dark:bg-gray-900" 
    x-data="eventsApp()"
    x-init="init()">
    {% csrf_token %}
    <!-- Hero Section -->
    <div class="relative bg-gradient-to-r from-indigo-600 to-purple-600">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white sm:text-4xl">Club Events</h1>
                <p class="mt-3 max-w-2xl mx-auto text-indigo-100 sm:text-lg">
                    Discover and participate in exciting events from various clubs
                </p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search and Filters -->
        <div class="mb-8 space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="h-5 w-5 text-gray-400"></i>
                </div>
                <input
                    type="text"
                    x-model="searchQuery"
                    class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg leading-5 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="Search events..."
                >
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-4">
                <!-- Club Filter -->
                <div class="relative flex-1">
                    <select
                        x-model="selectedClub"
                        class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
                    >
                        <option value="all">All Clubs</option>
                        {% for club in clubs %}
                        <option value="{{ club.id }}">{{ club.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Sort Filter -->
                <div class="relative flex-1">
                    <select
                        x-model="selectedSort"
                        class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
                    >
                        <option value="newest">Newest First</option>
                        <option value="upcoming">Upcoming First</option>
                        <option value="popular">Most Popular</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Events Feed -->
        <div class="space-y-6">
            <template x-for="event in filteredEvents()" :key="event.id">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                    <!-- Event Header -->
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <!-- Club Info -->
                            <div class="flex items-center space-x-3">
                                <img :src="event.club.image" :alt="event.club.name" class="h-10 w-10 rounded-full object-cover">
                                <div>
                                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="event.club.name"></h3>
                                    <p class="text-sm text-gray-500 dark:text-gray-400" x-text="formatDate(event.created_at)"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Event Title and Description -->
                        <a :href="`/events/${event.id}`" class="block group">
                            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors" x-text="event.title"></h2>
                            <div class="relative">
                                <p class="text-gray-600 dark:text-gray-300 line-clamp-3" x-text="event.description"></p>
                                <div x-show="event.description.length > 200" class="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-t from-white dark:from-gray-800 to-transparent"></div>
                                <button x-show="event.description.length > 200" 
                                        class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 mt-2">
                                    See more
                                </button>
                            </div>
                        </a>

                        <!-- Event Details -->
                        <div class="mt-4 inline-flex items-center px-3 py-1 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm text-gray-700 dark:text-gray-300">
                            <i data-lucide="calendar" class="h-4 w-4 mr-2 text-gray-500"></i>
                            <span x-text="formatDate(event.date)"></span>
                            <span class="mx-2">•</span>
                            <i data-lucide="clock" class="h-4 w-4 mr-2 text-gray-500"></i>
                            <span x-text="formatTime(event.time)"></span>
                            <span class="mx-2">•</span>
                            <i data-lucide="map-pin" class="h-4 w-4 mr-2 text-gray-500"></i>
                            <span x-text="event.location"></span>
                        </div>
                    </div>

                    <!-- Event Media -->
                    <div class="relative max-w-7xl mx-auto mx-auto">
                        <template x-if="event.media.length === 1">
                            <div class="aspect-[21/9]"> <!-- or aspect-video -->
                                <img :src="event.media[0].url" :alt="event.title" 
                                    class="w-full h-full object-cover rounded-lg">
                            </div>
                        </template>
                        <template x-if="event.media.length === 2">
                            <div class="grid grid-cols-2 gap-2 aspect-[21/9]">
                                <img :src="event.media[0].url" :alt="event.title" class="w-full h-full object-cover">
                                <img :src="event.media[1].url" :alt="event.title" class="w-full h-full object-cover">
                            </div>
                        </template>
                        <template x-if="event.media.length === 3">
                            <div class="grid grid-rows-2 gap-1 aspect-[21/9]">
                                <div class="row-span-1 aspect-[21/9]">
                                    <img :src="event.media[0].url" :alt="event.title" class="w-full h-full object-cover">
                                </div>
                                <div class="grid grid-cols-2 gap-2 aspect-[21/9]">
                                    <img :src="event.media[1].url" :alt="event.title" class="w-full h-full object-cover">
                                    <img :src="event.media[2].url" :alt="event.title" class="w-full h-full object-cover">
                                </div>
                            </div>
                        </template>
                        <template x-if="event.media.length >= 4">
                            <div class="grid grid-cols-2 gap-2 aspect-[21/9]">
                                <div class="grid grid-rows-2 gap-2 aspect-[21/9]">
                                    <img :src="event.media[0].url" :alt="event.title" class="w-full h-full object-cover">
                                    <img :src="event.media[1].url" :alt="event.title" class="w-full h-full object-cover">
                                </div>
                                <div class="grid grid-rows-2 gap-1 aspect-[21/9]">
                                    <img :src="event.media[2].url" :alt="event.title" class="w-full h-full object-cover">
                                    <div class="relative">
                                        <img :src="event.media[3].url" :alt="event.title" class="w-full h-full object-cover">
                                        <template x-if="event.media.length > 4">
                                            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
                                                <span class="text-white text-xl font-semibold">+<span x-text="event.media.length - 4"></span> more</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Event Actions -->
                    <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700">
                    <div class="flex items-center justify-between">
                        <!-- Reactions Summary -->
                        <div class="flex items-center space-x-6">
                            <div class="flex items-center space-x-2">
                                <div class="flex -space-x-1">
                                    <template x-for="(reaction, index) in event.reactions.slice(0, 3)" :key="index">
                                        <img :src="reaction.user.avatar" :alt="reaction.user.name" 
                                            class="h-6 w-6 rounded-full ring-2 ring-white dark:ring-gray-800">
                                    </template>
                                </div>
                                <button @click="showReactors(event.id)" class="text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                                    <span x-text="event.reactions.length"></span> reactions
                                </button>
                            </div>
                            <a :href="`/events/${event.id}#comments`" class="text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                                <span x-text="event.comments.length"></span> comments
                            </a>
                        </div>

                        <!-- Participate Button -->
                        <template x-if="isEventActive(event.date)">
                            <button @click="participateInEvent(event.id)"
                                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white"
                                    :class="event.is_participating ? 'bg-green-600 hover:bg-green-700' : 'bg-indigo-600 hover:bg-indigo-700'">
                                <i :data-lucide="event.is_participating ? 'user-check' : 'user-plus'" class="h-4 w-4 mr-2"></i>
                                <span x-text="event.is_participating ? 'Participating' : 'Participate'"></span>
                            </button>
                        </template>
                        <template x-if="!isEventActive(event.date)">
                            <button class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-gray-600 hover:bg-gray-700 transition-colors">
                                <i data-lucide="user-minus" class="h-4 w-4 mr-2"></i>
                                Event Over
                            </button>
                        </template>
                    </div>

                    <!-- Action Buttons -->
                    <div class="mt-4 flex items-center justify-between border-t border-gray-200 dark:border-gray-700 pt-4">
                        <div x-data="{ showReactions: false }" class="relative flex-1">
                            <template x-if="!getUserReaction(event.id)">
                                <button @click="showReactions = !showReactions" 
                                        @mousedown="startReactionTimer(event.id)"
                                        @mouseup="clearReactionTimer()"
                                        @mouseleave="clearReactionTimer()"
                                        class="w-full flex items-center justify-center space-x-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 py-2 rounded-md transition-colors">
                                    <i data-lucide="heart" class="h-5 w-5"></i>
                                    <span>React</span>
                                </button>
                            </template>
                            <template x-if="getUserReaction(event.id)">
                                <button @click="removeReaction(event.id)"
                                        class="w-full flex items-center justify-center space-x-2 text-indigo-600 dark:text-indigo-400 hover:bg-gray-100 dark:hover:bg-gray-700 py-2 rounded-md transition-colors">
                                    <span x-text="reactionTypes[getUserReaction(event.id)]" class="text-xl"></span>
                                    <i data-lucide="heart-handshake" class="h-5 w-5"></i>
                                    <span class="capitalize" x-text="getUserReaction(event.id).toLowerCase()"></span>
                                </button>
                            </template>
                            <div x-show="showReactions" 
                                @click.away="showReactions = false"
                                class="absolute bottom-full left-0 mb-2 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-2 flex space-x-2">
                                <template x-for="(emoji, reaction) in reactionTypes" :key="reaction">
                                    <button @click="reactToEvent(event.id, reaction); showReactions = false" 
                                            class="text-2xl hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded" 
                                            x-text="emoji"></button>
                                </template>
                            </div>
                        </div>
                        <a :href="`/events/${event.id}#comments`" 
                            class="flex-1 flex items-center justify-center space-x-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 py-2 rounded-md transition-colors">
                            <i data-lucide="message-circle" class="h-5 w-5"></i>
                            <span>Comment</span>
                        </a>
                        <button @click="showShareModal(event.id)"
                                class="flex-1 flex items-center justify-center space-x-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 py-2 rounded-md transition-colors">
                            <i data-lucide="share-2" class="h-5 w-5"></i>
                            <span>Share</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
        <!-- Empty State -->
        <div x-show="filteredEvents().length === 0" class="text-center py-12">
            <i data-lucide="calendar-x" class="mx-auto h-12 w-12 text-gray-400 dark:text-gray-600"></i>
            <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">No events found</h3>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Try adjusting your search or filter criteria
            </p>
        </div>
    </div>
    <!-- Reactors Modal -->
    <div x-show="showReactorsModal" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="showReactorsModal" 
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" 
                aria-hidden="true">
            </div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div x-show="showReactorsModal" 
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white" id="modal-title">
                                Reactions
                            </h3>
                            <div class="mt-2 max-h-60 overflow-y-auto">
                                <template x-for="reactor in currentReactors" :key="reactor.id">
                                    <div class="flex items-center justify-between py-2 px-3 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-lg">
                                        <div class="flex items-center space-x-3">
                                            <img :src="reactor.avatar" :alt="reactor.name" class="h-8 w-8 rounded-full">
                                            <span x-text="reactor.name" class="text-sm text-gray-700 dark:text-gray-300"></span>
                                        </div>
                                        <span x-text="reactionTypes[reactor.reaction]" class="text-xl"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="showReactorsModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div x-show="showShareModal" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="showShareModal" 
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" 
                aria-hidden="true"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div x-show="showShareModal" 
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white" id="modal-title">
                                Share Event
                            </h3>
                            <div class="mt-2">
                                <div class="flex space-x-4 justify-center">
                                    <button @click="shareToFacebook()" class="text-blue-600 hover:text-blue-700">
                                        <i data-lucide="facebook" class="h-8 w-8"></i>
                                    </button>
                                    <button @click="shareToTwitter()" class="text-blue-400 hover:text-blue-500">
                                        <i data-lucide="twitter" class="h-8 w-8"></i>
                                    </button>
                                    <button @click="shareToLinkedIn()" class="text-blue-700 hover:text-blue-800">
                                        <i data-lucide="linkedin" class="h-8 w-8"></i>
                                    </button>
                                </div>
                                <div class="mt-4">
                                    <input type="text" :value="currentShareLink" readonly 
                                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                    >
                                    <button @click="copyShareLink()" 
                                        class="mt-2 w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 dark:bg-indigo-500 text-white hover:bg-indigo-700 dark:hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition-colors duration-200 text-base font-medium sm:text-sm"
                                    > Copy Link
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="showShareModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const currentUserId = {{ current_user_id }};
</script>
<script>
    function eventsApp() {
        return {
            searchQuery: '',
            selectedClub: 'all',
            selectedSort: 'newest',
            showFilters: false,
            events: JSON.parse('{{ events|escapejs }}'),
            showReactorsModal: false,
            showShareModal: false,
            currentReactors: [],
            currentShareLink: '',
            reactionTimer: null,
            currentEvent: null,
            userReactions: {}, // Store user reactions by event ID
            reactionTypes: {
                'LIKE': '👍',
                'LOVE': '❤️',
                'HAHA': '😂',
                'WOW': '😮',
                'SAD': '😢',
                'ANGRY': '😠'
            },

            init() {
                this.formatDates();
                // Initialize user reactions
                this.events = JSON.parse(this.events);
                this.events.forEach(event => {
                    const userReaction = event.reactions.find(r => r.user.id === currentUserId);
                    if (userReaction) {
                        this.userReactions[event.id] = userReaction.reaction;
                    }
                });
            },

            formatDates() {
                this.events.forEach(event => {
                    event.formattedDate = this.formatDate(event.date);
                    event.formattedTime = this.formatTime(event.time);
                });
            },

            filteredEvents() {
                return this.events.filter(event => {
                    const matchesSearch = event.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                        event.description.toLowerCase().includes(this.searchQuery.toLowerCase());
                    const matchesClub = this.selectedClub === 'all' || event.club.id === parseInt(this.selectedClub);
                    return matchesSearch && matchesClub;
                }).sort((a, b) => {
                    if (this.selectedSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
                    if (this.selectedSort === 'upcoming') return new Date(a.date) - new Date(b.date);
                    if (this.selectedSort === 'popular') return b.reactions.length - a.reactions.length;
                    return 0;
                });
            },

            formatDate(date) {
                return new Date(date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            },

            formatTime(time) {
                return new Date(`1970-01-01T${time}`).toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            },

            isEventActive(date) {
                return new Date(date) > new Date();
            },

            startReactionTimer(eventId) {
                this.reactionTimer = setTimeout(() => {
                    this.showReactions = true;
                }, 500);
            },

            clearReactionTimer() {
                if (this.reactionTimer) {
                    clearTimeout(this.reactionTimer);
                    this.reactionTimer = null;
                }
            },

            getUserReaction(eventId) {
                return this.userReactions[eventId] || null;
            },

            async reactToEvent(eventId, reaction) {
                try {
                    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                    const response = await fetch(`/events/${eventId}/react/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({ reaction: reaction })
                    });
        
                    if (response.ok) {
                        const data = await response.json();
                        // Update the events data
                        this.events = this.events.map(event => {
                            if (event.id === eventId) {
                                return {
                                    ...event,
                                    reactions: data.reactions,
                                    userReaction: reaction
                                };
                            }
                            return event;
                        });
                        this.userReactions[eventId] = reaction;
                    }
                } catch (error) {
                    console.error('Error reacting to event:', error);
                }
            },

            removeReaction(eventId) {
                this.reactToEvent(eventId, null); // Send null to remove reaction
            },
            

            async showReactors(eventId) {
                try {
                    const response = await fetch(`/events/${eventId}/reactors/`);
                    if (response.ok) {
                        const data = await response.json();
                        this.currentReactors = data.reactors;
                        this.showReactorsModal = true;
                    }
                } catch (error) {
                    console.error('Error fetching reactors:', error);
                }
            },
            async participateInEvent(eventId) {
                try {
                    const response = await fetch(`/events/${eventId}/participate/`, {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                        }
                    });
                    
                    const data = await response.json();
                    
                    // Update local event data
                    const eventIndex = this.events.findIndex(e => e.id === eventId);
                    if (eventIndex !== -1) {
                        this.events[eventIndex].is_participating = data.is_participating;
                        this.events[eventIndex].participant_count = data.participant_count;
                    }
                    
                    // Show success message
                    if (data.status === 'added') {
                        alert('Successfully joined the event!');
                    } else {
                        alert('Successfully left the event!');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to update participation status');
                }
            },

            showShareModal(eventId) {
                const event = this.events.find(e => e.id === eventId);
                if (event) {
                    this.currentShareLink = `${window.location.origin}/events/${event.share_link}`;
                    this.showShareModal = true;
                }
            },

            shareToFacebook() {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(this.currentShareLink)}`, '_blank');
            },

            shareToTwitter() {
                window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(this.currentShareLink)}`, '_blank');
            },

            shareToLinkedIn() {
                window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(this.currentShareLink)}`, '_blank');
            },

            copyShareLink() {
                navigator.clipboard.writeText(this.currentShareLink).then(() => {
                    alert('Link copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                });
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });
</script>
{% endblock %}
